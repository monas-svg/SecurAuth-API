{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SecureAuth{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span>SecureAuth</span>
        </div>
        <nav class="nav">
          <a href="{% url 'web-home' %}">Accueil</a>
          <a href="{% url 'web-login' %}">Connexion</a>
          <a href="{% url 'web-register' %}">Inscription</a>
          <a href="{% url 'web-forgot-password' %}">Mot de passe</a>
          <a href="{% url 'web-profile' %}">Profil</a>
        </nav>
      </header>

      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    <footer class="site-footer">
      <p>© 2026 réalisé par Mohamed Nasser Mounchikpou Njiemessa.</p>
    </footer>

    <script src="{% static 'js/app.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
