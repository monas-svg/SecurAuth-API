{% extends 'base.html' %}

{% block title %}Mot de passe oublié | SecureAuth{% endblock %}

{% block content %}
<section class="form-card card">
  <div class="form-header">
    <p class="eyebrow">Sécurité</p>
    <h2>Mot de passe oublié</h2>
  </div>

  <div class="info-banner">
    Saisissez votre adresse email pour recevoir un lien de réinitialisation.
  </div>

  <form id="forgotPasswordForm">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="nom@entreprise.com" required />
    </div>

    <button class="button primary full" type="submit">Envoyer le lien</button>
    <div id="forgotMessage" class="message" aria-live="polite"></div>
  </form>

  <a class="inline-link" href="{% url 'web-login' %}">Retour à la connexion</a>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('forgotPasswordForm');
    const messageBox = document.getElementById('forgotMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      try {
        const response = await fetch('/api/auth/password/reset/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || data.error || 'Erreur lors de l’envoi du lien.');
        }

        messageBox.textContent = data.message || 'Un lien de réinitialisation a été envoyé si le compte existe.';
        messageBox.classList.add('success');
        form.reset();
      } catch (error) {
        messageBox.textContent = error.message;
        messageBox.classList.add('error');
      }
    });
  });
</script>
{% endblock %}
