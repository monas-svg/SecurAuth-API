{% extends 'base.html' %}

{% block title %}Profil | SecureAuth{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-panel auth-form-panel">
    <h1>MY PROFILE</h1>
    <p class="login-subtitle">Manage your account details securely.</p>

    <div id="profileContent" class="profile-content">
      <p>Chargement du profil...</p>
    </div>
  </div>

  <div class="auth-panel auth-visual" aria-hidden="true"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const profileContent = document.getElementById('profileContent');
    const token = localStorage.getItem('access_token');

    if (!token) {
      profileContent.innerHTML = `
        <div class="warning-box">
          <p>Vous devez vous connecter pour voir votre profil.</p>
          <a class="button primary" href="{% url 'web-login' %}">Se connecter</a>
        </div>
      `;
      return;
    }

    try {
      const response = await fetch('/api/auth/profile/', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || 'Erreur de chargement du profil.');
      }

      profileContent.innerHTML = `
        <div class="profile-grid">
          <div class="profile-item"><span>Nom d'utilisateur</span><strong>${data.username || '—'}</strong></div>
          <div class="profile-item"><span>Email</span><strong>${data.email || '—'}</strong></div>
          <div class="profile-item"><span>Prénom</span><strong>${data.first_name || '—'}</strong></div>
          <div class="profile-item"><span>Nom</span><strong>${data.last_name || '—'}</strong></div>
        </div>
        <button class="button secondary" id="logoutButton" type="button">Se déconnecter</button>
      `;

      document.getElementById('logoutButton').addEventListener('click', async () => {
        const refreshToken = localStorage.getItem('refresh_token');
        if (refreshToken) {
          await fetch('/api/auth/logout/', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ refresh: refreshToken }),
          });
        }

        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        localStorage.removeItem('user');
        window.location.href = '{% url "web-login" %}';
      });
    } catch (error) {
      profileContent.innerHTML = `
        <div class="warning-box">
          <p>${error.message}</p>
          <a class="button primary" href="{% url 'web-login' %}">Se reconnecter</a>
        </div>
      `;
    }
  });
</script>
{% endblock %}
