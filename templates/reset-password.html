{% extends 'base.html' %}

{% block title %}Réinitialiser le mot de passe | SecureAuth{% endblock %}

{% block content %}
<section class="form-card card">
  <div class="form-header">
    <p class="eyebrow">Nouveau mot de passe</p>
    <h2>Réinitialiser votre mot de passe</h2>
  </div>

  <form id="resetPasswordForm">
    <div class="field">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" name="password" type="password" required />
    </div>

    <div class="field">
      <label for="password_confirm">Confirmer le mot de passe</label>
      <input id="password_confirm" name="password_confirm" type="password" required />
    </div>

    <button class="button primary full" type="submit">Valider</button>
    <div id="resetMessage" class="message" aria-live="polite"></div>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const token = urlParams.get('token');
    const form = document.getElementById('resetPasswordForm');
    const messageBox = document.getElementById('resetMessage');

    if (!uid || !token) {
      messageBox.textContent = 'Lien invalide ou expiré. Demandez un nouveau message de réinitialisation.';
      messageBox.classList.add('error');
      form.querySelector('button').disabled = true;
      return;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password_confirm').value;

      try {
        const response = await fetch('/api/auth/password/confirm/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid,
            token,
            password,
            password_confirm: passwordConfirm,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          const detail = data?.detail || Object.values(data || {})?.flat()?.[0] || 'Impossible de réinitialiser le mot de passe.';
          throw new Error(detail);
        }

        messageBox.textContent = data.message || 'Votre mot de passe a bien été réinitialisé.';
        messageBox.classList.add('success');
        form.reset();

        setTimeout(() => {
          window.location.href = '{% url "web-login" %}';
        }, 1200);
      } catch (error) {
        messageBox.textContent = error.message;
        messageBox.classList.add('error');
      }
    });
  });
</script>
{% endblock %}
